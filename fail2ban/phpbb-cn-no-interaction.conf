# Fail2Ban filter - deferred CN no-interaction signal (5 minutes)
# Source log: /var/log/security_audit.log
# Signal is emitted by phpBB stats extension: cn_no_interaction_5m

[Definition]

failregex = ^.*PHPBB-SIGNAL ip=<HOST> session=\S+ user_id=\d+ signals="(?:[^"]*,)?cn_no_interaction_5m(?:,[^"]*)?".*$
ignoreregex =

[Init]

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
